<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="mic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#accent-grad)" stroke-width="6" stroke-opacity="0.5" />

  <!-- Center Glowing Ring -->
  <circle cx="256" cy="230" r="130" fill="none" stroke="url(#accent-grad)" stroke-width="8" stroke-dasharray="16 12" opacity="0.6" />
  <circle cx="256" cy="230" r="105" fill="#1e293b" opacity="0.8" filter="url(#glow)" />

  <!-- Microphone Icon -->
  <g fill="url(#mic-grad)" transform="translate(256, 220)">
    <!-- Mic capsule -->
    <rect x="-24" y="-55" width="48" height="90" rx="24" />
    <!-- Sound bars inside mic -->
    <path d="M-12 -25 h24 M-12 -10 h24 M-12 5 h24" stroke="#6366f1" stroke-width="4" stroke-linecap="round" />
    <!-- Mic cradle -->
    <path d="M-40 -10 v20 a40 40 0 0 0 80 0 v-20" fill="none" stroke="url(#accent-grad)" stroke-width="10" stroke-linecap="round" />
    <!-- Stand stem -->
    <path d="M0 50 v32" fill="none" stroke="url(#accent-grad)" stroke-width="10" stroke-linecap="round" />
    <!-- Stand base -->
    <path d="M-30 82 h60" fill="none" stroke="url(#accent-grad)" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Badge at bottom: Shopping cart & Fork/Spoon spark -->
  <g transform="translate(256, 415)">
    <rect x="-110" y="-28" width="220" height="56" rx="28" fill="#1e293b" stroke="url(#accent-grad)" stroke-width="3" />
    <text x="0" y="8" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" text-anchor="middle" letter-spacing="2">HUB ASSISTANT</text>
  </g>
</svg>
